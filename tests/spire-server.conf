server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    trust_domain = "example.org"
    data_dir = "/tmp/spire-server/data"
    log_level = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/tmp/spire-server/data/datastore.sqlite3"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    NodeAttestor "tpm" {
        plugin_cmd = "/usr/bin/tpm_attestor_server"
        plugin_data {
            hash_path = "/tmp"
        }
    }
}
