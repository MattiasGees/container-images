name: Docker Image untagged cleanup

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  delete-untagged-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged ubuntu-tools and spire-tools images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: container-images/ubuntu-tools,container-images/spire-tools
          delete-untagged: true
          older-than: 7 days
          validate: true
